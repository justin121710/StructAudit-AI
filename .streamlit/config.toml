# 配色依書稿（《Midas Civil 橋梁結構分析與設計實務》）：teal 1E7F86 為可操作元素、navy 1F3A5F 為標題；與 rc-member-designer、midas-curve-gen 一致
[theme]
base = "light"
primaryColor = "#1E7F86"
backgroundColor = "#F3F4F6"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#151C24"
borderColor = "#DCE0E5"
linkColor = "#17666C"
redColor = "#B03A2E"
orangeColor = "#9A5E10"
greenColor = "#1E7A44"
font = "Noto Sans TC:https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap, Microsoft JhengHei, sans-serif"
baseFontSize = 14
baseRadius = "6px"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#E8EDF3"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
